# ============================================================
# YongleNuclearExplosion
# 永乐核爆插件配置
# ============================================================


# ============================================================
# 核爆设置
# ============================================================
explosion:

  # 是否启用核爆
  enabled: true

  # 核爆半径
  # 单位：方块
  radius: 43

  # 是否破坏方块
  break-blocks: true

  # 是否产生火焰
  set-fire: true

  # 火焰持续时间
  # 20 ticks = 1 秒
  # 200 = 10 秒
  fire-duration-ticks: 500

  # 实体最大伤害
  # 越靠近爆炸中心伤害越高
  max-damage: 300.0


  # ==========================================================
  # 核爆掉落物
  # ==========================================================
  drops:

    # 是否掉落被炸毁方块的物品
    enabled: true

    # 最大掉落物数量
    max-items: 5000



# ============================================================
# 领地保护
# ============================================================
protection:

  # ==========================================================
  # PlotSquared
  # ==========================================================
  #
  # true：
  #   PlotSquared 领地中的方块受到保护
  #
  # false：
  #   不使用 PlotSquared 保护
  #
  plotsquared: true


  # ==========================================================
  # Residence
  # ==========================================================
  #
  # true：
  #   其他玩家的 Residence 受到保护
  #
  # false：
  #   不使用 Residence 保护
  #
  residence: true



# ============================================================
# Residence 设置
# ============================================================
residence:

  # ==========================================================
  # 核反应堆所有者自己的 Residence
  # ==========================================================
  #
  # true：
  #   反应堆所有者自己的 Residence 允许核爆
  #
  # false：
  #   反应堆所有者自己的 Residence 也受到保护
  #
  default-nuclear: true



# ============================================================
# 核反应堆警告
# ============================================================
warning:

  # 放置核反应堆时是否显示警告
  enabled: true

  # 3D 警告文字距离反应堆的高度
  height: 1.8

  # 警告持续时间
  #
  # 20 ticks = 1 秒
  # 300 ticks = 15 秒
  duration-ticks: 400



# ============================================================
# 核爆效果
# ============================================================
effects:

  # 是否启用核爆音效和全服提示
  enabled: true

  # 核爆后额外播放多少次爆炸音效
  tnt-explosions: 16

  # 每次爆炸音效之间的间隔
  #
  # 20 ticks = 1 秒
  # 4 ticks = 0.2 秒
  tnt-interval: 4



# ============================================================
# 核爆撤回
# ============================================================
undo:

  # 最多保存多少次核爆记录
  #
  # 5 = 保存最近 5 次核爆
  max-history: 5



# ============================================================
# 核反应堆辐射 / 凋零
# ============================================================
reactor-wither:

  # 是否启用核反应堆凋零效果
  enabled: true

  # ==========================================================
  # 凋零影响范围
  # ==========================================================
  #
  # 单位：方块
  #
  # 例如：
  # 5  = 5 格
  # 10 = 10 格
  # 20 = 20 格
  #
  radius: 5


  # ==========================================================
  # 凋零持续时间
  # ==========================================================
  #
  # 20 ticks = 1 秒
  # 40 ticks = 2 秒
  #
  duration-ticks: 40


  # ==========================================================
  # 凋零等级
  # ==========================================================
  #
  # 0 = 凋零 I
  # 1 = 凋零 II
  # 2 = 凋零 III
  #
  amplifier: 0


  # ==========================================================
  # 检测间隔
  # ==========================================================
  #
  # 多久检查一次正在工作的核反应堆
  #
  # 10 ticks = 0.5 秒
  # 20 ticks = 1 秒
  #
  check-interval-ticks: 10